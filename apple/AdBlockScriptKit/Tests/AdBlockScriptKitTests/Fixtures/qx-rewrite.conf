#!name=Quantumult X sample
#!desc=rewrite, task, filter and mitm in one file

[rewrite_local]
^https?://example\.com/a url script-request-header https://example.com/x.js, tag=Req, timeout=5
^https?://example\.com/b url script-response-body https://example.com/y.js
^https?://example\.com/c url reject-dict
^https?://example\.com/d url reject-200
^https?://example\.com/e url 302 https://example.com/new
^https?://example\.com/f url reject-img

[task_local]
0 10 * * * https://example.com/task.js, tag=Daily, timeout=10

[filter_local]
host, example.com, REJECT
host-suffix, .ad.com, REJECT
ip-cidr, 1.2.3.0/24, REJECT

[mitm]
hostname = example.com, api.example.com
hostname-disabled = telemetry.example.com
